dataset:
  name: "Reside_OTS" # options: Reside_OTS | Paired (alias: PairedDataset)
  root: "./datasets/SOTS_outdoor" # dataset root folder
  hazy_path: "hazy" # only used for Reside_OTS
  clear_path: "clear" # only used for Reside_OTS
  img_size: 256
  return_bboxes: false
  subset: False # int limit, or false for full dataset

training:
  device: "cuda"
  batch_size: 2
  num_workers: 0

model:
  name: "LDNet" # options: AODNet, LCANet, FFANet, LDNet, LFDNet
  save_path: "./runs/LDNet"

evaluation:
  device: "cuda" # fallback to cpu if cuda is unavailable
  checkpoint_path: "./pretrained_models/LD-Net/Epoch59.pth" # required
  save_path: "./runs/eval/LDNet" # output root for eval runs
  split: "full" # val | train | full
  val_split: 0.2 # only used when split is val or train
  seed: 42 # random split seed
  batch_size: 2 # optional override (default: training.batch_size)
  num_workers: 0 # optional override (default: training.num_workers)
  pin_memory: true
  save_example: true # saves one comparison image in outputs/
  filename_prefix: "eval" # prefix for saved sample image
