# train_aod_spatial.yaml
dataset:
  name: "Reside_OTS" # options: Reside_OTS | Paired (alias: PairedDataset)
  root: "./datasets/RESIDE-OTS" # Root des Datensatzes
  #name: "RTTS"
  #root: "./datasets/RTTS/RTTS"
  hazy_path: "hazy-part2" # nur fuer Reside_OTS
  clear_path: "clear" # nur fuer Reside_OTS
  img_size: 256 # Resize auf (img_size, img_size)
  return_bboxes: false # fuer Dehazing-Training i.d.R. false
  subset: false # int fuer Teilmenge, oder false fuer kompletten Datensatz

training:
  device: "cuda" # cuda | cpu
  batch_size: 3
  lr: 0.0002
  weight_decay: 0.0
  epochs: 50
  num_workers: 2
  checkpoint_root: "./checkpoints" # Ordner fuer best/last/epoch_XXX Checkpoints
  selection_metric: "psnr" # options: psnr | map50 | hybrid (speichert zusaetzlich best_psnr/best_map50)
  od_eval_every: false # positive int fuer Intervall, false deaktiviert OD-Eval; fuer map50/hybrid muss es aktiv sein
  od_eval_subset: 100 # RTTS-Subset fuer OD-Eval waehrend Training
  alpha_latency: 0.001 # nur fuer hybrid: score = map50 - alpha * avg_dehaze_ms
  perf_batches: 10 # Anzahl Batches fuer Dehaze-Latenzmessung pro Epoche
  early_stopping:
    enabled: false
    patience: 15
    min_delta: 0.0
    metric: "selection_score" # options: selection_score | psnr
  loss:
    mse_weight: 0.0
    l1_weight: 1.0
    ssim_weight: 0.1

model:
  name: "AODNetDepthwiseSpatial" # options: AODNet | FFANet | LDNet | LFDNet | GCANet | TinyDehazeNet
  base_channels: 6
  attention_variant: "od_guided" # legacy_gaussian | od_guided | hybrid | none
  num_attention_peaks: 4
  use_input_edge: true
  use_channel_gate: true
  channel_gate_reduction: 8
  spatial_hidden_channels: 8
  sigma_scale: 0.4
  heatmap_augmentation: true
  alpha_init: 0.35
  save_path: "./runs/AODNetDepthwiseSpatial" # Run-Ordner fuer Logs/Outputs

  # Ablation examples:
  # legacy baseline:  base_channels=3, attention_variant=legacy_gaussian, num_attention_peaks=1,
  #                   use_input_edge=false, use_channel_gate=false
  # guided small:     base_channels=3, attention_variant=od_guided, num_attention_peaks=4,
  #                   use_input_edge=true, use_channel_gate=false
  # guided best mini: base_channels=6, attention_variant=od_guided, num_attention_peaks=4,
  #                   use_input_edge=true, use_channel_gate=true

detector:
  name: "yolov8" # aktuell nur yolov8 unterstuetzt
  weights: "./pretrained_models/YOLO/yolov8n.pt"
  device: "cuda:0" # cuda:0 | cpu
  conf: 0.25
  iou: 0.5
  imgsz: 512
  max_det: 300

evaluation_od:
  device: "cuda" # cuda | cpu
  save_path: "./runs/od_eval/AODNetDepthwiseSpatial_yolov8" # Zielordner fuer OD-Eval-Runs
  image_set: "test" # RTTS split file in ImageSets/Main
  batch_size: 1
  num_workers: 0
  pin_memory: true
  dehazer_input_size: 256 # false oder int (z.B. 224/256/512)
  #dehazer_checkpoint_path: "runs/AODNetDepthwiseGaussian/run_2026_03_11_22_33_07/models/best_map50_model.pth"
