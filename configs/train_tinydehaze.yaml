# train_tinydehaze.yaml
dataset:
  name: "Reside_OTS"
  root: "./datasets/RESIDE-OTS"
  hazy_path: "hazy-part2"
  clear_path: "clear"
  img_size: 256
  return_bboxes: false
  subset: 500

training:
  device: "cuda"
  batch_size: 4
  lr: 0.0002
  weight_decay: 0.0
  epochs: 30
  num_workers: 0
  selection_metric: "hybrid" # psnr | map50 | hybrid (additionally saves best_psnr and best_map50)
  od_eval_every: 10
  od_eval_subset: 100
  alpha_latency: 0.001
  perf_batches: 10

model:
  name: "TinyDehazeNet"
  base_channels: 8
  save_path: "./runs/tinydehaze"

detector:
  name: "yolov8"
  weights: "./pretrained_models/YOLO/yolov8n.pt"
  device: "cuda:0"
  conf: 0.25
  iou: 0.7
  imgsz: 512
  max_det: 300

evaluation_od:
  device: "cuda"
  image_set: "test"
  batch_size: 1
  num_workers: 0
  pin_memory: true
  dehazer_input_size: 224
